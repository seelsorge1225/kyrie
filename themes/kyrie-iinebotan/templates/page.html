<article class="page-card">
  {{{ nav.breadcrumbs }}}

  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {{{ page.meta_html }}}
  </header>

  <div class="page-content">
    {{{ page.content }}}
    {{{ page.folder_pages_html }}}
  </div>

  {{{ page.tags_html }}}

  <div class="iine-area">
    <button type="submit" class="newiine_btn" data-iinename="page">
      <span class="material-icons-round">favorite</span> いいね <span class="newiine_count"></span>
      <div class="newiine_thanks newiine_thanks_up"><p>ありがとうございます！</p></div>
    </button>
  </div>
</article>
