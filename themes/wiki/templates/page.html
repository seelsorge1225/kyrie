<article class="wiki-article">
  {{{ nav.breadcrumbs }}}

  <header class="wiki-article-header">
    <h1 class="wiki-article-title">{{ page.title }}</h1>
    {{# page.show_updated }}
    <p class="wiki-updated"><time datetime="{{ page.updated }}">最終更新日 {{ page.updated }}</time></p>
    {{/ page.show_updated }}
    {{{ page.meta_html }}}
    {{# page.toc }}
    <p class="wiki-mobile-toc-link-wrap"><a class="wiki-mobile-toc-link" href="#page-toc">目次</a></p>
    {{/ page.toc }}
  </header>

  <div class="page-content wiki-content">
    {{{ page.content }}}
    {{{ page.folder_pages_html }}}
  </div>
</article>
